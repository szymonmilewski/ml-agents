env_settings:
  num_envs: 1
behaviors:
  Basic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 40
      buffer_size: 100
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 20
      num_layers: 1
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.9
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000
    time_horizon: 3
    summary_freq: 2000

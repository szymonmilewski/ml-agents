behaviors:
  Basic:
    trainer_type: ppo
    hyperparameters:
      batch_size: [16, 32, 64, 128]
      buffer_size: [256]
      learning_rate: [0.0003]
      beta: [0.002, 0,003, 0,004, 0,006, 0,007]
      epsilon: [0.04, 0.06, 0.08, 0.12, 0.14, 0.16]
      lambd: [0.95]
      num_epoch: [3,4,5,6,7]
      learning_rate_schedule: [linear]
    network_settings:
      normalize: false
      hidden_units: 20
      num_layers: 1
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.9
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 300000
    time_horizon: 3
    summary_freq: 2000
